<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026全年份廠商餐費登記表</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --weekend-bg: #f39c12;
            --border-color: #444;
            --select-bg: #34495e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { padding: 15px; background: #fafafa; color: #333; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 15px; flex-wrap: wrap; gap: 10px; }
        h2 { color: var(--primary-color); letter-spacing: 2px; }
        
        /* 月份選擇器優化 */
        .month-selector-wrapper { display: flex; align-items: center; gap: 8px; }
        .month-select { background: var(--select-bg); color: white; border: none; padding: 8px 16px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; outline: none; }
        
        .action-bar { max-width: 1200px; margin: 0 auto 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 0.95rem; }
        .btn-save { background: #16a085; }
        .btn-export { background: #2980b9; }
        .btn-clear { background: #e74c3c; margin-left: auto; }

        /* 表格樣式調整 - 完美還原紙本矩陣 */
        .table-container { width: 100%; overflow-x: auto; max-width: 1200px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; text-align: center; }
        th, td { border: 1px solid var(--border-color); padding: 8px 4px; font-size: 0.95rem; }
        
        th { background-color: #f8f9fa; height: 50px; font-weight: bold; }
        .col-date { width: 50px; font-weight: bold; background: #eee; }
        .col-wday { width: 40px; font-weight: bold; background: #eee; }
        
        /* 週末顏色（橘黃色底） */
        .weekend { background-color: var(--weekend-bg) !important; color: white !important; }
        
        /* 輸入框優化 */
        .cell-input { width: 100%; border: none; background: transparent; text-align: center; font-size: 1rem; color: #222; padding: 4px 0; font-weight: 500; }
        .cell-input:focus { background: #e8f4f8; outline: none; border-radius: 4px; }
        .cell-input::placeholder { color: #ccc; font-weight: normal; font-size: 0.85rem; }
        
        /* 底部小計列 */
        .total-row { background: #eaeded; font-weight: bold; height: 45px; font-size: 1rem; }
        .total-val { color: #c0392b; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>廠 商 餐 費 登 記 表</h2>
        <div class="month-selector-wrapper">
            <label for="monthSelect" style="font-weight: bold; color: var(--primary-color);">切換月份：</label>
            <select id="monthSelect" class="month-select" onchange="switchMonth()">
                <!-- JS 自動生成 1~12 月 -->
            </select>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-save" onclick="saveData()">💾 儲存本月資料</button>
        <button class="btn btn-export" onclick="exportCSV()">📊 匯出本月 Excel (CSV)</button>
        <button class="btn btn-clear" id="clearBtn" onclick="clearCurrentMonth()">⚠️ 清空本月</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">日期</th>
                    <th style="width: 50px;">星期</th>
                    <th>(祥萬)<br>林大哥</th>
                    <th>(祥萬)<br>傅大哥</th>
                    <th>俊丰</th>
                    <th>廠商 4</th>
                    <th>廠商 5</th>
                    <th>廠商 6</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 由 JavaScript 根據月份動態生成 -->
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="2">總金額小計</td>
                    <td id="total-0" class="total-val">$0</td>
                    <td id="total-1" class="total-val">$0</td>
                    <td id="total-2" class="total-val">$0</td>
                    <td id="total-3" class="total-val">$0</td>
                    <td id="total-4" class="total-val">$0</td>
                    <td id="total-5" class="total-val">$0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        const totalVendors = 6;
        const year = 2026;
        const weekDaysArr = ["日", "一", "二", "三", "四", "五", "六"];
        
        // 2026年每個月的天數
        const daysInMonths = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        // 初始化月份下拉選單
        const monthSelect = document.getElementById('monthSelect');
        for (let m = 1; m <= 12; m++) {
            let opt = document.createElement('option');
            opt.value = m;
            opt.innerText = `2026年 ${String(m).padStart(2, '0')}月`;
            monthSelect.appendChild(opt);
        }
        
        // 預設載入當前月份（以 2026 年 5 月為例，若要抓系統當前月可改為 new Date().getMonth() + 1）
        // 這裡我們預設幫你停留在你剛剛拍的 5 月
        monthSelect.value = 5;

        // 生成表格主功能
        function renderTable(month) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const totalDays = daysInMonths[month - 1];
            
            // 讀取該月份在 Local Storage 的資料
            let savedData = JSON.parse(localStorage.getItem(`meal_data_${year}_${month}`)) || {};

            for (let d = 1; d <= totalDays; d++) {
                const tr = document.createElement('tr');
                
                // 精準計算 2026 年每天是星期幾
                const dateObj = new Date(year, month - 1, d);
                const wdayNum = dateObj.getDay(); // 0 是禮拜天，1 是禮拜一...
                const wdayStr = weekDaysArr[wdayNum];
                const isWeekend = (wdayNum === 0 || wdayNum === 6); // 0(日) 或 6(六)
                const weekendClass = isWeekend ? 'weekend' : '';

                // 日期與星期
                tr.innerHTML += `<td class="col-date ${weekendClass}">${d}</td>`;
                tr.innerHTML += `<td class="col-wday ${weekendClass}">${wdayStr}</td>`;

                // 廠商輸入格
                for (let v = 0; v < totalVendors; v++) {
                    const cellId = `cell_${d}_${v}`;
                    const val = savedData[cellId] || '';
                    
                    // 特殊節日提示（例如 5/1 勞動節）
                    let placeholder = "";
                    if (month === 5 && d === 1 && v === 0 && val === "") {
                        placeholder = "勞動節";
                    }

                    tr.innerHTML += `
                        <td class="${weekendClass}">
                            <input type="text" id="${cellId}" class="cell-input" 
                                   value="${val}" placeholder="${placeholder}" oninput="calculateTotals()">
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            }
            calculateTotals();
        }

        // 切換月份
        function switchMonth() {
            const currentMonth = document.getElementById('monthSelect').value;
            renderTable(currentMonth);
        }

        // 解析並計算混合儲存格 (例如: "65x4", "260元")
        function parseValue(str) {
            if (!str) return 0;
            let cleanStr = str.replace(/[元小計收：:]/g, '').replace(/×/g, '*').replace(/x/g, '*').trim();
            if (cleanStr.includes('*')) {
                let parts = cleanStr.split('*');
                let num1 = parseFloat(parts[0]) || 0;
                let num2 = parseFloat(parts[1]) || 0;
                return num1 * num2;
            }
            return parseFloat(cleanStr) || 0;
        }

        // 即時計算小計
        function calculateTotals() {
            const month = document.getElementById('monthSelect').value;
            const totalDays = daysInMonths[month - 1];

            for (let v = 0; v < totalVendors; v++) {
                let vendorTotal = 0;
                for (let d = 1; d <= totalDays; d++) {
                    const cellId = `cell_${d}_${v}`;
                    const inputEl = document.getElementById(cellId);
                    if (inputEl) {
                        vendorTotal += parseValue(inputEl.value);
                    }
                }
                document.getElementById(`total-${v}`).innerText = `$${vendorTotal.toLocaleString()}`;
            }
        }

        // 儲存當前月份資料
        function saveData() {
            const month = document.getElementById('monthSelect').value;
            const totalDays = daysInMonths[month - 1];
            let dataToSave = {};

            for (let d = 1; d <= totalDays; d++) {
                for (let v = 0; v < totalVendors; v++) {
                    const cellId = `cell_${d}_${v}`;
                    const val = document.getElementById(cellId).value.trim();
                    if (val) dataToSave[cellId] = val;
                }
            }
            localStorage.setItem(`meal_data_${year}_${month}`, JSON.stringify(dataToSave));
            alert(`💾 2026年${month}月的餐費資料已成功鎖定存檔！`);
        }

        // 清空當前月份
        function clearCurrentMonth() {
            const month = document.getElementById('monthSelect').value;
            if (confirm(`確定要清空 2026年${month}月 的整張表嗎？其他月份不會受影響。`)) {
                localStorage.removeItem(`meal_data_${year}_${month}`);
                renderTable(month);
            }
        }

        // 匯出 CSV
        function exportCSV() {
            const month = document.getElementById('monthSelect').value;
            const totalDays = daysInMonths[month - 1];
            
            let csvContent = "\uFEFF日期,星期,(祥萬)林大哥,(祥萬)傅大哥,俊丰,廠商4,廠商5,廠商6\n";
            
            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(year, month - 1, d);
                const wdayStr = weekDaysArr[dateObj.getDay()];
                let rowStr = `${d},${wdayStr}`;
                
                for (let v = 0; v < totalVendors; v++) {
                    const cellId = `cell_${d}_${v}`;
                    const val = document.getElementById(cellId).value || "";
                    rowStr += `,"${val.replace(/"/g, '""')}"`;
                }
                csvContent += rowStr + "\n";
            }
            
            let totalRowStr = "總計,";
            for (let v = 0; v < totalVendors; v++) {
                totalRowStr += `,${document.getElementById(`total-${v}`).innerText}`;
            }
            csvContent += totalRowStr + "\n";

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `2026年${String(month).padStart(2, '0')}月_廠商餐費登記表.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 網頁開啟時首次載入
        renderTable(monthSelect.value);
    </script>
</body>
</html>
